<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Istrefi">
  <meta name="theme-color" content="#0b0d10">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>Istrefi Workout</title>
</head>
<body>
  <header id="top">
    <button id="back" class="icon-btn" hidden aria-label="Tilbake"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 id="title"></h1>
    <div id="hright"></div>
  </header>

  <main id="main"><p class="muted center">Laster…</p></main>

  <div id="banner" hidden></div>

  <div id="rest" hidden>
    <div id="rest-bar"></div>
    <div class="rest-inner">
      <span class="rest-lbl">Hvile</span>
      <b id="rest-t">0:00</b>
      <button class="btn sm" data-a="restAdj" data-s="-15">−15</button>
      <button class="btn sm" data-a="restAdj" data-s="15">+15</button>
      <button class="btn sm primary" data-a="restSkip">Hopp over</button>
    </div>
  </div>

  <nav id="tabs">
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Hjem</span></a>
    <a href="#/plan" data-tab="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Økter</span></a>
    <a href="#/library" data-tab="library"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg><span>Øvelser</span></a>
    <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span>Logg</span></a>
    <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg><span>Fremgang</span></a>
  </nav>

  <div id="sheet" hidden>
    <div class="sheet-bg" data-a="closeSheet"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
